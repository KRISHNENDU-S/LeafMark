name: LeafMark CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Cypress dependencies
        working-directory: testing
        run: npm install

      - name: Run Cypress tests
        working-directory: testing
        run: npx cypress run